name: Export from Framer and publish

# Re-exports https://issei-en.com with tools/framer-export.mjs and publishes
# the result to GitHub Pages. Run it again from the Actions tab whenever the
# Framer site changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the Framer site
        run: |
          # A <user>.github.io repo is served from the domain root; any other
          # repo is served from /<repo>/.
          repo="${{ github.event.repository.name }}"
          case "$repo" in *.github.io) base="/" ;; *) base="/$repo/" ;; esac
          node tools/framer-export.mjs https://issei-en.com --base-path "$base" --out _site
      - name: Show export report
        run: cat _site/export-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
